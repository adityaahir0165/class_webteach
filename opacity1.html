<html>
<head>
      <title>css opacity example</title>

           <style>
                 .box1{
                               background-color: green;
                                   opacity: 1;
                                   }

                         .box2{
                               background-color:  green;
                                   opacity: 0.5;
                                   }

                         .box3{
                               background-color: green;
                                   opacity: 0.2;
                                   }



          </div>
        </style>
</head>

<body>

      <div class="box1">
               opacity 1
          </div>

          <div class="box2">
               opacity 0.5
          </div>

          <div class="box3">
               opacity 0.1
          </div>


</body>
</html>
